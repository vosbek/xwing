name: Windows build

# Builds the standalone Windows game (no installs needed to play) and uploads it as a
# downloadable artifact. Tag a commit `v*` to also publish it as a GitHub Release.
on:
  push:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.3-stable

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache Godot and export templates
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-mono-windows

      - name: Download Godot (.NET) and Windows export templates
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          base=https://github.com/godotengine/godot/releases/download/$GODOT_VERSION
          mkdir -p ~/godot && cd ~/godot
          curl -sSL -o godot.zip $base/Godot_v${GODOT_VERSION}_mono_linux_x86_64.zip
          unzip -q godot.zip && rm godot.zip
          curl -sSL -o templates.tpz $base/Godot_v${GODOT_VERSION}_mono_export_templates.tpz
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION/-/.}.mono
          mkdir -p "$dest"
          unzip -q -j templates.tpz templates/version.txt 'templates/windows_*_x86_64*.exe' -d "$dest"
          rm templates.tpz

      - name: Build and import
        run: |
          GODOT=$(ls ~/godot/*/Godot_v*_mono_linux.x86_64)
          echo "GODOT=$GODOT" >> $GITHUB_ENV
          dotnet build godot/XWingGodot.sln -c ExportRelease
          $GODOT --headless --editor --quit --path godot

      - name: Export Windows build
        run: |
          mkdir -p build/XWing-Remake
          $GODOT --headless --path godot --export-release "Windows Desktop" ../build/XWing-Remake/XWing.exe
          test -f build/XWing-Remake/XWing.exe
          cp dist/windows/* build/XWing-Remake/

      - uses: actions/upload-artifact@v4
        with:
          name: XWing-Remake-windows
          path: build/XWing-Remake

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd build && zip -q -r -9 XWing-Remake-windows.zip XWing-Remake
          gh release create "$GITHUB_REF_NAME" XWing-Remake-windows.zip --title "$GITHUB_REF_NAME" --notes "Standalone Windows build. Unzip and run XWing.exe."
        env:
          GH_TOKEN: ${{ github.token }}
